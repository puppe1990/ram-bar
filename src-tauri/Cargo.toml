[package]
name = "ram-bar"
version = "0.1.0"
edition = "2021"

[lib]
name = "ram_bar"
path = "src/lib.rs"

[[bin]]
name = "ram-bar"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
desktop = ["dep:tauri"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.33"
tauri = { version = "2", optional = true, features = ["tray-icon", "macos-private-api"] }

[dev-dependencies]
fake = "2"
